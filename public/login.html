<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1929">
  <meta name="description" content="IQPREC — AI-powered Fantasy Premier League intelligence. Intelligence. Precision. Every Gameweek.">
  <title>Log in — IQPREC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=Noto+Sans+Arabic:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body data-page="login" data-public="true">
  <div class="app-shell">
    <div class="content">
      <header class="topbar">
        <a class="topbar-brand-mobile" href="/index.html" style="text-decoration:none">
          <span class="logo-iq">IQ</span><span class="logo-prec">PREC</span>
        </a>
        <button class="lang-toggle" data-action="lang-toggle" type="button" aria-label="Toggle language">العربية</button>
      </header>

      <main class="content-body">
        <div class="auth-wrap">
          <div class="auth-card card card-elevated">
            <a href="/index.html" class="auth-logo" id="auth-logo" aria-label="IQPREC"></a>

            <h1 class="auth-title" data-i18n="auth.login.title">Sign in to IQPREC</h1>
            <p class="auth-subtitle" data-i18n="auth.login.subtitle">Welcome back. Keep your edge every gameweek.</p>

            <form id="login-form" novalidate>
              <div class="field">
                <label class="field-label" for="login-email" data-i18n="auth.login.email">Email</label>
                <input class="input" type="email" id="login-email" name="email"
                       autocomplete="email" inputmode="email" required
                       data-i18n-placeholder="auth.login.emailPh" placeholder="you@example.com">
              </div>

              <div class="field">
                <label class="field-label" for="login-password" data-i18n="auth.login.password">Password</label>
                <div class="input-wrap">
                  <input class="input" type="password" id="login-password" name="password"
                         autocomplete="current-password" required
                         data-i18n-placeholder="auth.login.passwordPh" placeholder="••••••••">
                  <button class="pw-toggle" type="button" data-role="toggle-password"
                          aria-controls="login-password"
                          data-i18n="auth.show" data-i18n-aria-label="auth.show">Show</button>
                </div>
              </div>

              <div class="auth-row">
                <label class="checkbox">
                  <input type="checkbox" id="login-remember" checked>
                  <span data-i18n="auth.login.remember">Remember me</span>
                </label>
                <a href="/forgot-password.html" data-i18n="auth.login.forgot">Forgot password?</a>
              </div>

              <div class="auth-error" id="login-error" role="alert" hidden></div>

              <button class="btn btn-primary btn-block" type="submit" id="login-submit"
                      data-i18n="auth.login.submit">Sign In</button>
            </form>

            <p class="auth-alt">
              <span data-i18n="auth.login.noAccount">Don't have an account?</span>
              <a href="/register.html" data-i18n="auth.login.registerLink">Create one</a>
            </p>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <p data-i18n="footer.rights">All Rights Reserved © IQPREC</p>
        <p><span data-i18n="footer.credit">Designed and Developed by Jacob Qumsiyeh</span>
          — <a href="https://jacobqum.dev" target="_blank" rel="noopener">jacobqum.dev</a></p>
      </footer>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
