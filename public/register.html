<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1929">
  <meta name="description" content="IQPREC — AI-powered Fantasy Premier League intelligence. Intelligence. Precision. Every Gameweek.">
  <title>Create account — IQPREC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=Noto+Sans+Arabic:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/register.css">
</head>
<body data-page="register" data-public="true">
  <div class="app-shell">
    <div class="content">
      <header class="topbar">
        <a class="topbar-brand-mobile" href="/index.html" style="text-decoration:none">
          <span class="logo-iq">IQ</span><span class="logo-prec">PREC</span>
        </a>
        <button class="lang-toggle" data-action="lang-toggle" type="button" aria-label="Toggle language">العربية</button>
      </header>

      <main class="content-body">
        <div class="auth-wrap">
          <div class="auth-card card card-elevated" id="register-card">
            <a href="/index.html" class="auth-logo" id="auth-logo" aria-label="IQPREC"></a>

            <h1 class="auth-title" data-i18n="auth.register.title">Create your IQPREC account</h1>
            <p class="auth-subtitle" data-i18n="auth.register.subtitle">7-day free trial — no card required.</p>

            <form id="register-form" novalidate>
              <div class="field">
                <label class="field-label" for="reg-name" data-i18n="auth.register.name">Full name</label>
                <input class="input" type="text" id="reg-name" name="fullName" autocomplete="name" required
                       data-i18n-placeholder="auth.register.namePh" placeholder="Your name">
                <span class="field-error" id="reg-name-error" hidden></span>
              </div>

              <div class="field">
                <label class="field-label" for="reg-email" data-i18n="auth.register.email">Email</label>
                <input class="input" type="email" id="reg-email" name="email"
                       autocomplete="email" inputmode="email" required
                       data-i18n-placeholder="auth.login.emailPh" placeholder="you@example.com">
                <span class="field-error" id="reg-email-error" hidden></span>
              </div>

              <div class="field">
                <label class="field-label" for="reg-password" data-i18n="auth.register.password">Password</label>
                <div class="input-wrap">
                  <input class="input" type="password" id="reg-password" name="password"
                         autocomplete="new-password" required
                         data-i18n-placeholder="auth.login.passwordPh" placeholder="••••••••">
                  <button class="pw-toggle" type="button" data-role="toggle-password"
                          aria-controls="reg-password"
                          data-i18n="auth.show" data-i18n-aria-label="auth.show">Show</button>
                </div>
                <!-- 4-stage strength bar (CSS width transitions) -->
                <div class="pw-strength" id="reg-strength" aria-hidden="true">
                  <div class="pw-strength-track"><div class="pw-strength-fill"></div></div>
                  <div class="pw-strength-label"></div>
                </div>
                <span class="field-hint" data-i18n="auth.pwHint">At least 8 characters, with upper, lower, number, and a symbol.</span>
              </div>

              <div class="field">
                <label class="field-label" for="reg-confirm" data-i18n="auth.register.confirm">Confirm password</label>
                <div class="input-wrap">
                  <input class="input" type="password" id="reg-confirm" name="confirm"
                         autocomplete="new-password" required placeholder="••••••••">
                  <button class="pw-toggle" type="button" data-role="toggle-confirm"
                          aria-controls="reg-confirm"
                          data-i18n="auth.show" data-i18n-aria-label="auth.show">Show</button>
                </div>
                <span class="field-error" id="reg-confirm-error" hidden></span>
              </div>

              <div class="field">
                <label class="field-label" for="reg-ref" data-i18n="auth.register.ref">Referral code (optional)</label>
                <input class="input" type="text" id="reg-ref" name="referralCode"
                       autocomplete="off" maxlength="16"
                       data-i18n-placeholder="auth.register.refPh" placeholder="Enter code">
              </div>

              <div class="auth-error" id="register-error" role="alert" hidden></div>

              <button class="btn btn-primary btn-block" type="submit" id="register-submit"
                      data-i18n="auth.register.submit">Create account</button>
            </form>

            <p class="auth-alt">
              <span data-i18n="auth.register.haveAccount">Already have an account?</span>
              <a href="/login.html" data-i18n="auth.register.loginLink">Sign in</a>
            </p>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <p data-i18n="footer.rights">All Rights Reserved © IQPREC</p>
        <p><span data-i18n="footer.credit">Designed and Developed by Jacob Qumsiyeh</span>
          — <a href="https://jacobqum.dev" target="_blank" rel="noopener">jacobqum.dev</a></p>
      </footer>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
